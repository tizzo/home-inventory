name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-lambda:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-rust@v1

      - name: Install cargo-lambda
        run: pip install cargo-lambda

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lambda-${{ hashFiles('backend/Cargo.lock', 'backend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-lambda-

      - name: Build Lambda function
        working-directory: backend
        run: |
          cargo lambda build --release --arm64 --output-format zip
          ls -lh target/lambda/home-inventory-backend/bootstrap.zip

      - name: Upload Lambda ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: backend/target/lambda/home-inventory-backend/bootstrap.zip
          retention-days: 30

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ""
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

  deploy-infrastructure:
    needs: [build-lambda, build-frontend]
    runs-on: ubuntu-latest
    # The AWS role (gha-home-inventory, defined in tizzo/aws-foundation) trusts
    # only jobs in this environment, and the environment deploys only from main.
    # Keep id-token here, not at the workflow level, so build jobs and their
    # third-party actions and dependencies never get a token.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Lambda ZIP
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip
          path: infrastructure/dist/

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::168450803450:role/github-actions/gha-home-inventory
          aws-region: us-east-1

      - uses: pulumi/actions@v5

      - name: Install Pulumi dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Pulumi Up
        run: pulumi up --stack prod --yes
        working-directory: infrastructure
        # State backend and KMS secrets provider come from Pulumi.yaml and
        # Pulumi.prod.yaml; the role can use both.

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.FRONTEND_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
